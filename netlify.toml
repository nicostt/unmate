# Configuración de Netlify (el hosting). Lo que está acá manda sobre lo que
# se haya cargado a mano en la página de Netlify.

[build]
  # Cómo se construye la web y en qué carpeta queda el resultado.
  command = "npm run build"
  publish = ".next"

# Adaptador de Next.js: convierte el resultado de la construcción en una web
# que Netlify sabe servir. Sin esto Netlify publica la carpeta .next "cruda"
# y toda la web responde "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"
